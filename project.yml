name: Widget
options:
  bundleIdPrefix: com.iosmirror
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  Widget:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
        excludes:
          - "**/.DS_Store"
      - path: Widget/Sources/Views
        excludes:
          - "**/.DS_Store"
      - path: Widget/Sources/ViewModels
        excludes:
          - "**/.DS_Store"
      - path: Widget/Sources/Services
        excludes:
          - "**/.DS_Store"
      - path: Widget/Sources/Utilities
        excludes:
          - "**/.DS_Store"
      - path: Widget/Sources/Shared
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iosmirror
        INFOPLIST_FILE: Widget/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SUPPORTS_MACCATALYST: NO
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.iosmirror
          - group.com.iosmirror.J3D2F4SMVD
          - group.J3D2F4SMVD.com.iosmirror
    dependencies:
      - target: BroadcastExtension
        embed: true

  BroadcastExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WidgetExtension
        excludes:
          - "**/.DS_Store"
      - path: Widget/Sources/Shared
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iosmirror.broadcast
        INFOPLIST_FILE: WidgetExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: WidgetExtension/BroadcastExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.iosmirror
          - group.com.iosmirror.J3D2F4SMVD
          - group.J3D2F4SMVD.com.iosmirror