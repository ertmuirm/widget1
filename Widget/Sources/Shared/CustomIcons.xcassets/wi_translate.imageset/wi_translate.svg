<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Globe outline -->
  <circle cx="11" cy="12" r="5.5"/>
  <!-- Latitude band (upper + lower arcs of equator) -->
  <path d="M5.5 12 Q11 9 16.5 12 Q11 15 5.5 12"/>
  <!-- Meridian arcs (left and right halves of vertical) -->
  <path d="M11 6.5 Q9 12 11 17.5"/>
  <path d="M11 6.5 Q13 12 11 17.5"/>
  <!-- Clockwise rotation arrow — right side, top to bottom -->
  <path d="M15 6.5 A10 10 0 0 1 20.5 13.5"/>
  <polyline points="18.8,12 20.5,13.5 19.2,15.2"/>
  <!-- Counter-clockwise rotation arrow — left side, bottom to top -->
  <path d="M7 17.5 A10 10 0 0 1 1.5 10.5"/>
  <polyline points="2.8,12 1.5,10.5 2.8,8.8"/>
</svg>
