<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Globe outline -->
  <circle cx="12" cy="12" r="7"/>
  <!-- Latitude arcs (upper and lower halves of equator band) -->
  <path d="M5 12 Q12 8.5 19 12"/>
  <path d="M5 12 Q12 15.5 19 12"/>
  <!-- Meridian arcs (left and right halves of central vertical) -->
  <path d="M12 5 Q9.5 12 12 19"/>
  <path d="M12 5 Q14.5 12 12 19"/>
  <!-- Top circular arrow (clockwise, arrowhead pointing right) -->
  <path d="M8 3.5 A9.5 9.5 0 0 1 17 4.5" stroke-linecap="round"/>
  <polyline points="15,2.5 17,4.5 15.5,6.5"/>
  <!-- Bottom circular arrow (counter-clockwise, arrowhead pointing left) -->
  <path d="M16 20.5 A9.5 9.5 0 0 1 7 19.5" stroke-linecap="round"/>
  <polyline points="9,21.5 7,19.5 8.5,17.5"/>
</svg>
