<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Globe outline (fills most of canvas) -->
  <circle cx="12" cy="12" r="7"/>
  <!-- Equator (upper + lower latitude arcs) -->
  <path d="M5 12 Q12 8.5 19 12"/>
  <path d="M5 12 Q12 15.5 19 12"/>
  <!-- Vertical meridian (left + right halves) -->
  <path d="M12 5 Q9.5 12 12 19"/>
  <path d="M12 5 Q14.5 12 12 19"/>
  <!-- Clockwise rotation arrow — sweeps around right side of globe, arrowhead at bottom -->
  <path d="M17 6 A11.5 11.5 0 0 1 17 18" stroke-linecap="round"/>
  <polyline points="15,16.5 17,18 19,16.5"/>
  <!-- Counter-clockwise rotation arrow — sweeps around left side, arrowhead at top -->
  <path d="M7 18 A11.5 11.5 0 0 1 7 6" stroke-linecap="round"/>
  <polyline points="9,7.5 7,6 5,7.5"/>
</svg>
