<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Bow: open arc. Centre (7,12) radius 6.5.
       Arc endpoints (13,9.5) and (13,14.5) are exactly on the circle,
       large arc counter-clockwise = sweeps around the left side only.
       No arc on the right side where the shaft opens. -->
  <path d="M13 9.5 A6.5 6.5 0 1 0 13 14.5"/>
  <!-- Inner hole -->
  <circle cx="7" cy="12" r="1.8"/>
  <!-- Shaft + two teeth. Open path (no Z) so no line closes across the bow opening. -->
  <path d="M13 9.5 H22.5 V14.5 H21 V17 H19 V14.5 H17 V18 H15 V14.5 H13"/>
</svg>
