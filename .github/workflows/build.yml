name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Package IPA
        run: |
          # Build main app target (includes extension due to dependency)
          xcodebuild -project Widget.xcodeproj -target Widget -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            OTHER_CODE_SIGN_FLAGS="--" \
            build 2>&1 | tail -30
          
          # Find Widget.app
          APP=$(find ./build -name "Widget.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            mkdir -p Payload
            cp -R "$APP" Payload/Widget.app
            chmod +x Payload/Widget.app/Widget || true
            echo "Found: $APP"
          else
            echo "Not found"
            exit 1
          fi
          
          cd Payload && zip -r ../Widget.ipa . && cd ..
          ls -la *.ipa 
    
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
