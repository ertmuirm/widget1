name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          # Output archive path for next steps
          echo "ARCHIVE_PATH=./build/Widget.xarchive" >> $GITHUB_ENV
          echo "ARCHIVE_PATH" $(./build/Widget.xarchive)

      - name: Package as IPA
        run: |
          # Try local path first, then find in DerivedData
          ARCHIVE_PATH="./build/Widget.xarchive"
          if [ ! -d "$ARCHIVE_PATH" ]; then
            ARCHIVE_PATH=$(ls -d ~/Library/Developer/Xcode/DerivedData/Widget-*/Build/Intermediates.noindex/ArchiveIntermediates/Widget/*.xarchive 2>/dev/null | head -1)
          fi
          if [ -z "$ARCHIVE_PATH" ] || [ ! -d "$ARCHIVE_PATH" ]; then
            ARCHIVE_PATH="$HOME/Library/Developer/Xcode/DerivedData/Widget-hhstiicoevshrpceguycxqigmwsr/Build/Intermediates.noindex/ArchiveIntermediates/Widget/Widget.xarchive"
          fi
          echo "Using archive: $ARCHIVE_PATH"
          ls -la "$ARCHIVE_PATH/Products/Applications/" || ls -la "$ARCHIVE_PATH/"
          # Create IPA
          mkdir -p Payload
          cp -r "$ARCHIVE_PATH/Products/Applications/Widget.app" Payload/
          chmod +x Payload/Widget.app/Widget || true
          zip -r Widget.ipa Payload
          ls -la Widget.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
