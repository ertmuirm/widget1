name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Package IPA
        run: |
          # Build - xcodebuild archive uses default DerivedData location
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          # Find the archive in DerivedData
          echo "=== Locating archive ==="
          ARCHIVE_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Widget.xarchive" -type d 2>/dev/null | head -1)
          
          if [ -n "$ARCHIVE_PATH" ]; then
            echo "Archive at: $ARCHIVE_PATH"
            # Check for app in Products/Applications
            if [ -d "$ARCHIVE_PATH/Products/Applications/Widget.app" ]; then
              mkdir -p Payload
              cp -r "$ARCHIVE_PATH/Products/Applications/Widget.app" Payload/
              zip -r Widget.ipa Payload
              echo "IPA created"
            else
              # Try BuildProductsPath
              find "$ARCHIVE_PATH" -name "Widget.app" -type d | head -1 | xargs -I{} cp -r "{}" Payload/ 2>/dev/null
              zip -r Widget.ipa Payload
            fi
          else
            echo "Archive not found"
            exit 1
          fi
          
          ls -la *.ipa 
    
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
