name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          echo "ARCHIVE_PATH=$(./build/Widget.xarchive)" >> $GITHUB_ENV

      - name: Package as IPA
        run: |
          # Find the archive in DerivedData if not in build folder
          ARCHIVE_PATH="./build/Widget.xarchive"
          if [ ! -d "$ARCHIVE_PATH/Products" ]; then
            ARCHIVE_PATH=$(ls -d $HOME/Library/Developer/Xcode/DerivedData/Widget-*/Build/Intermediates.noindex/ArchiveIntermediates/Widget/*.xarchive 2>/dev/null | head -1)
          fi
          echo "Using archive: $ARCHIVE_PATH"
          mkdir -p Payload
          cp -r "$ARCHIVE_PATH/Products/Applications/Widget.app" Payload/
          chmod +x Payload/Widget.app/Widget || true
          zip -r Widget.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
