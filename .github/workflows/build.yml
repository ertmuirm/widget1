name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Package IPA
        run: |
          # Build the archive
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          # Look for the app in the working DerivedData
          WORK_DIR="$HOME/work/widget1/widget1"
          SOURCE_DIR="$HOME/Library/Developer/Xcode/DerivedData"
          
          # Find Widget.app that was just built
          echo "=== Finding built app ==="
          find "$SOURCE_DIR" -name "Widget.app" -type d 2>/dev/null | head -3
          
          # Use last resort: copy from derived data 
          APK=$(find "$SOURCE_DIR" -name "Widget.app" -type d 2>/dev/null | head -1)
          
          if [ -n "$APK" ] && [ -d "$APK" ]; then
            mkdir -p Payload
            cp -r "$APK" Payload/
            zip -r Widget.ipa Payload
            echo "IPA created successfully"
            ls -la Widget.ipa
          else
            echo "ERROR: Widget.app not found"
            exit 1
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
