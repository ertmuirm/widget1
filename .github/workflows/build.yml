name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Package IPA
        run: |
          # Build the archive - note the exact DerivedData path
          DD_BASE="Widget-hhstiicoevshrpceguycxqigmwsr"
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            -derivedDataPath "$HOME/Library/Developer/Xcode/DerivedData/$DD_BASE" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          # Use exact path from build log
          DD="$HOME/Library/Developer/Xcode/DerivedData/$DD_BASE"
          APP_PATH="$DD/Build/Intermediates.noindex/ArchiveIntermediates/Widget/InstallationBuildProductsLocation/Applications/Widget.app"
          
          echo "=== Looking for app at: $APP_PATH ==="
          ls -la "$APP_PATH"
          
          if [ -d "$APP_PATH" ]; then
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r Widget.ipa Payload
            echo "IPA created"
            ls -la Widget.ipa
          else
            echo "ERROR: Not found"
            ls -la "$DD" 2>/dev/null
            exit 1
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
