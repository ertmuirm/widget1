name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Package IPA
        run: |
          # Build AND force archive to local folder
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            -derivedDataPath ./derived \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          # Now copy app from derived  
          echo "=== Finding built app ==="
          find ./derived -name "Widget.app" -type d 2>/dev/null | head -3
          
          APP=$(find ./derived -name "Widget.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            mkdir -p Payload
            cp -r "$APP" Payload/
            zip -r Widget.ipa Payload || true
            if [ -f Widget.ipa ]; then
              echo "SUCCESS - IPA created!"
              ls -la Widget.ipa
            else
              echo "fallback: zip failed, uploading build folder"
              zip -r Widget.xarchive.zip ./derived || true
            fi
          else
            echo "fallback: no app found, uploading derived folder"
            zip -r Widget.xarchive.zip ./derived || true
          fi
          
          ls -la *.ipa *.zip 2>/dev/null || echo "No artifacts created"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: |
            Widget.ipa
            Widget.xarchive.zip
          retention-days: 30
