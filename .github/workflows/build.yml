name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Package IPA
        run: |
          # Build WITHOUT derivedDataPath - use xcode default
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          # Find the archive in ~/Library/Developer/Xcode/DerivedData
          DD="$HOME/Library/Developer/Xcode/DerivedData"
          ARCHIVE_DIR=$(ls -dt "$DD"/Widget-*/ 2>/dev/null | head -1)
          
          echo "Archive dir: $ARCHIVE_DIR"
          ls -la "$ARCHIVE_DIR"
          
          # The archive has Products in it
          ls -la "$ARCHIVE_DIR/Build/Products/" 2>/dev/null || echo "No Products"
          ls -la "$ARCHIVE_DIR/Build/Intermediates.noindex/ArchiveIntermediates/Widget/" 2>/dev/null || echo "No ArchiveIntermediates"
          
          # Copy app from whichever location exists
          if [ -d "$ARCHIVE_DIR/Build/Products/Applications/Widget.app" ]; then
            cp -R "$ARCHIVE_DIR/Build/Products/Applications/Widget.app" Payload/
          elif [ -d "$ARCHIVE_DIR/Build/Intermediates.noindex/ArchiveIntermediates/Widget/InstallationBuildProductsLocation/Applications/Widget.app" ]; then
            cp -R "$ARCHIVE_DIR/Build/Intermediates.noindex/ArchiveIntermediates/Widget/InstallationBuildProductsLocation/Applications/Widget.app" Payload/
          fi
          
          cd Payload && zip -r ../Widget.ipa . && cd ..
          ls -la *.ipa 
    
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
