name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Package IPA
        run: |
          # Build
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          # Direct path from build logs
          DD="$HOME/Library/Developer/Xcode/DerivedData/Widget-hhstiicoevshrpceguycxqigmwsr"
          APP="$DD/Build/Intermediates.noindex/ArchiveIntermediates/Widget/InstallationBuildProductsLocation/Applications/Widget.app"
          
          echo "=== Checking app at: $APP ==="
          ls -la "$APP" 2>/dev/null && echo "App found!"
          
          if [ -d "$APP" ]; then
            rm -rf Payload
            mkdir -p Payload
            cp -R "$APP" Payload/Widget.app
            cd Payload && zip -r ../Widget.ipa . && cd ..
            echo "IPA created!"
          else
            echo "App directory missing"
            exit 1
          fi
          
          ls -la *.ipa 
    
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
