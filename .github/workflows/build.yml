name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          # Output archive path for next steps
          echo "ARCHIVE_PATH=./build/Widget.xarchive" >> $GITHUB_ENV
          echo "ARCHIVE_PATH" $(./build/Widget.xarchive)

      - name: Package as IPA
        run: |
          # Find the built app in DerivedData
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData/Widget-hhstiicoevshrpceguycxqigmwsr" -name "Widget.app" -type d 2>/dev/null | head -1)
          
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Using app at: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            chmod +x Payload/Widget.app/Widget 2>/dev/null || true
            cd Payload
            zip -r ../Widget.ipa .
            cd ..
            ls -la Widget.ipa
          else
            echo "ERROR: Widget.app not found"
            exit 1
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
