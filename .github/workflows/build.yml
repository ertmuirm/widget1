name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Package IPA
        run: |
          # Build AND force archive to local folder
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            -derivedDataPath ./derived \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          # Now copy app from derived  
          echo "=== Finding built app ==="
          find ./derived -name "Widget.app" -type d 2>/dev/null | head -3
          
          APP=$(find ./derived -name "Widget.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ] && [ -d "$APP" ]; then
            mkdir -p Payload
            cp -r "$APP" Payload/
            zip -r Widget.ipa Payload 
    
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
