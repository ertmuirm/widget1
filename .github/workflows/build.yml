name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Package IPA
        run: |
          # Build the archive
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          # The .xarchive is an Xcode archive - users can manually export it on Mac:
          # xcodebuild -exportArchive -archivePath Widget.xarchive -exportPath ./output -exportOptionsPlist export.plist
          # Or via Xcode: File > Export > Export as Ad Hoc
          echo "=== Build complete, creating archive artifact ==="
          echo "To create IPA on Mac:"
          echo "1. Open this .xarchive in Xcode"
          echo "2. File > Export > Export as Ad Hoc"
          echo "OR command line:"
          echo "xcodebuild -exportArchive -archivePath Widget.xarchive -exportPath output"
          zip -r Widget.xarchive.zip ./build/Widget.xarchive
          ls -la Widget.xarchive.zip

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.xarchive.zip
          retention-days: 30
