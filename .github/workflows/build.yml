name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Package IPA
        run: |
          # Build archive
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          # Use xcodebuild -exportArchive to extract the app from the archive
          # This uses the archive file we just created
          xcodebuild -exportArchive \
            -archivePath ./build/Widget.xarchive \
            -exportPath ./exported \
            -exportOptionsPlist /dev/stdin <<< '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
          </dict>
          </plist>'
          
          ls -la ./exported/
          ls -la ./exported/Applications/ 2>/dev/null || ls -la ./exported/*.app 2>/dev/null
          
          # Create IPA from exported
          if [ -d "./exported/Applications/Widget.app" ]; then
            cp -R "./exported/Applications/Widget.app" Payload/
          elif [ -d "./exported/Widget.app" ]; then
            cp -R "./exported/Widget.app" Payload/
          fi
          
          cd Payload && zip -r ../Widget.ipa . && cd ..
          ls -la *.ipa 
    
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
