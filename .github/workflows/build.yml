name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          # Output archive path for next steps
          echo "ARCHIVE_PATH=./build/Widget.xarchive" >> $GITHUB_ENV
          echo "ARCHIVE_PATH" $(./build/Widget.xarchive)

      - name: Package as IPA
        run: |
          # Try multiple paths to find the built app
          DD="$HOME/Library/Developer/Xcode/DerivedData/Widget-hhstiicoevshrpceguycxqigmwsr"
          ARCHIVE_PATH="./build/Widget.xarchive"
          
          # Try InstallationBuildProductsLocation (where xcodebuild actually puts the app)
          APP_PATH="$DD/Build/Intermediates.noindex/ArchiveIntermediates/Widget/InstallationBuildProductsLocation/Applications/Widget.app"
          
          if [ -d "$APP_PATH" ]; then
            echo "Using app at: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            chmod +x Payload/Widget.app/Widget || true
            zip -r Widget.ipa Payload
            ls -la Widget.ipa
          else
            # Fallback
            echo "Trying alternate paths..."
            ls -la "$DD/Build/Intermediates.noindex/ArchiveIntermediates/Widget/" || echo "Not found"
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
