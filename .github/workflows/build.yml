name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify extension in build
        run: |
          ls -la ./build/Widget.xarchive/Products/Applications/Widget.app/
          ls -la ./build/Widget.xarchive/Products/Applications/Widget.app/PlugIns/ 2>/dev/null || echo "⚠️ Extension not found in PlugIns"

      - name: Build (unsigned)
        run: |
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r ./build/Widget.xarchive/Products/Applications/Widget.app Payload/
          chmod +x Payload/Widget.app/Widget
          zip -r Widget.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
