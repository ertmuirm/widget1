name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          # Output archive path for next steps
          echo "ARCHIVE_PATH=./build/Widget.xarchive" >> $GITHUB_ENV
          echo "ARCHIVE_PATH" $(./build/Widget.xarchive)

      - name: Package as IPA
        run: |
          # xcodebuild archive creates an .xcarchive with the app inside
          # Try multiple possible archive locations
          
          # First try the local build path
          ARCHIVE="./build/Widget.xarchive"
          if [ -d "$ARCHIVE/Products/Applications/Widget.app" ]; then
            APP_PATH="$ARCHIVE/Products/Applications/Widget.app"
          # Then try DerivedData
          elif [ -d "$HOME/Library/Developer/Xcode/DerivedData/Widget-hhstiicoevshrpceguycxqigmwsr/Build/Intermediates.noindex/ArchiveIntermediates/Widget/Widget.xarchive/Products/Applications/Widget.app" ]; then
            APP_PATH="$HOME/Library/Developer/Xcode/DerivedData/Widget-hhstiicoevshrpceguycxqigmwsr/Build/Intermediates.noindex/ArchiveIntermediates/Widget/Widget.xarchive/Products/Applications/Widget.app"
          # Search for most recent archive
          else
            RECENT=$(find "$HOME/Library/Developer/Xcode/DerivedData" -name "Widget.xarchive" -type d 2>/dev/null | head -1)
            if [ -d "$RECENT/Products/Applications/Widget.app" ]; then
              APP_PATH="$RECENT/Products/Applications/Widget.app"
            fi
          fi
          
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Using app at: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            chmod +x Payload/Widget.app/Widget 2>/dev/null || true
            cd Payload
            zip -r ../Widget.ipa .
            cd ..
            ls -la Widget.ipa
          else
            echo "ERROR: Widget.app not found"
            find "$HOME/Library/Developer/Xcode/DerivedData" -name "Widget.app" 2>/dev/null | head -3
            find "$HOME/Library/Developer/Xcode/DerivedData" -name "Widget.xarchive" 2>/dev/null | head -3
            exit 1
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
