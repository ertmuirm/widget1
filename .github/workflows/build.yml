name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Package IPA
        run: |
          # Build - xcodebuild archive uses default DerivedData location
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          # Find Widget.app in DerivedData - the app is at InstallationBuildProductsLocation
          echo "=== Locating Widget.app ==="
          DD="$HOME/Library/Developer/Xcode/DerivedData"
          DD_HASH=$(ls -d "$DD"/Widget-*/ 2>/dev/null | head -1)
          
          if [ -n "$DD_HASH" ]; then
            APP="$DD_HASH/Build/Intermediates.noindex/ArchiveIntermediates/Widget/InstallationBuildProductsLocation/Applications/Widget.app"
            echo "Checking: $APP"
            
            if [ -d "$APP" ]; then
              echo "Found app!"
              mkdir -p Payload
              cp -r "$APP" Payload/
              zip -r Widget.ipa Payload
              echo "IPA created"
            else
              # Try alternate path
              find "$DD" -name "Widget.app" -type d 2>/dev/null | head -1 | xargs -I{} cp -r "{}" Payload/ 2>/dev/null
              zip -r Widget.ipa Payload
            fi
          else
            echo "DerivedData not found"
            exit 1
          fi
          
          ls -la *.ipa 
    
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
