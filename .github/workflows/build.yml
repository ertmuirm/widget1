name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Package IPA
        run: |
          # Build the archive
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          # Export from archive to IPA using xcodebuild -exportArchive
          xcodebuild -exportArchive \
            -archivePath ./build/Widget.xarchive \
            -exportPath ./build/Widget.ipa \
            -exportOptionsPlist /dev/stdin <<< '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
          </dict>
          </plist>'
          
          ls -la ./build/*.ipa 2>/dev/null || ls -la ./Widget.ipa 2>/dev/null || echo "Trying manual package"
          
          # Manual backup: if xcodebuild export fails
          if [ ! -f ./build/Widget.ipa ] && [ ! -f ./Widget.ipa ]; then
            APP="./build/Widget.xarchive/Products/Applications/Widget.app"
            if [ -d "$APP" ]; then
              mkdir -p Payload
              cp -r "$APP" Payload/
              zip -r Widget.ipa Payload
            fi
          fi
          
          ls -la *.ipa 2>/dev/null

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
