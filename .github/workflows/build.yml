name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Package IPA
        run: |
          # Build using xcodebuild build (NOT archive) to get product
          xcodebuild -scheme Widget -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            OTHER_CODE_SIGN_FLAGS="--" \
            build 2>&1 | tail -20
          
          # Now check in the build folder
          echo "=== Checking build output ==="
          ls -la ./build/Build/Products/Release-iphoneos/ 2>/dev/null || echo "Not there"
          
          # Find Widget.app anywhere in build
          APP=$(find ./build -name "Widget.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            echo "Found: $APP"
            # Check what's inside
            echo "=== Contents of Widget.app ==="
            ls -la "$APP/"
            # Check for executable - iOS 18 may have it in different location
            echo "=== Looking for executable ==="
            find "$APP" -type f -name "Widget" 2>/dev/null || echo "No executable found"
            find "$APP" -type f -perm -u+x 2>/dev/null | head -5 || echo "No executable with perms"
            
            mkdir -p Payload
            cp -R "$APP" Payload/Widget.app
            # Find the actual executable and chmod it
            EXEC=$(find Payload/Widget.app -type f -name "Widget" -o -type f -name "Widget*" 2>/dev/null | head -1)
            if [ -n "$EXEC" ]; then
              echo "Chmod: $EXEC"
              chmod +x "$EXEC"
            else
              echo "Warning: No executable found to chmod"
            fi
          else
            echo "Not found"
            exit 1
          fi
          
          cd Payload && zip -r ../Widget.ipa . && cd ..
          ls -la *.ipa 
    
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
