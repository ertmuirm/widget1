name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Package IPA
        run: |
          # Build the archive to local folder
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          
          # The .xarchive contains the app - let's just zip it up
          # and try to find the app inside it
          echo "=== Contents of archive ==="
          ls -la ./build/Widget.xarchive/ 2>/dev/null || echo "No xarchive"
          ls -la ./build/Widget.xarchive/Products/ 2>/dev/null || echo "No Products"
          ls -la ./build/Widget.xarchive/Products/Applications/ 2>/dev/null || echo "No Applications"
          
          # If archive has the app inside - package it
          APP="./build/Widget.xarchive/Products/Applications/Widget.app"
          if [ -d "$APP" ]; then
            mkdir -p Payload
            cp -r "$APP" Payload/
            zip -r Widget.ipa Payload
            echo "IPA created from archive"
            ls -la Widget.ipa
          else
            echo "WARNING: No app in archive, uploading xarchive instead"
            zip -r Widget.xarchive.zip ./build/Widget.xarchive
            ls -la Widget.xarchive.zip
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: |
            Widget.ipa
            Widget.xarchive.zip
          retention-days: 30
