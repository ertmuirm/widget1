name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild archive -scheme Widget -configuration Release \
            -archivePath ./build/Widget.xarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          # Output archive path for next steps
          echo "ARCHIVE_PATH=./build/Widget.xarchive" >> $GITHUB_ENV
          echo "ARCHIVE_PATH" $(./build/Widget.xarchive)

      - name: Package as IPA
        run: |
          DD="$HOME/Library/Developer/Xcode/DerivedData/Widget-hhstiicoevshrpceguycxqigmwsr"
          
          # Multiple possible locations for the built app
          if [ -d "$DD/Build/Intermediates.noindex/ArchiveIntermediates/Widget/BuildProductsPath/Release-iphoneos/Widget.app" ]; then
            APP_PATH="$DD/Build/Intermediates.noindex/ArchiveIntermediates/Widget/BuildProductsPath/Release-iphoneos/Widget.app"
          elif [ -d "$DD/Build/Intermediates.noindex/ArchiveIntermediates/Widget/InstallationBuildProductsLocation/Applications/Widget.app" ]; then
            APP_PATH="$DD/Build/Intermediates.noindex/ArchiveIntermediates/Widget/InstallationBuildProductsLocation/Applications/Widget.app"
          elif [ -d "./build/Widget.xarchive/Products/Applications/Widget.app" ]; then
            APP_PATH="./build/Widget.xarchive/Products/Applications/Widget.app"
          else
            APP_PATH=""
          fi
          
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "Using app at: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            chmod +x Payload/Widget.app/Widget 2>/dev/null || true
            cd Payload
            zip -r ../Widget.ipa .
            cd ..
            ls -la Widget.ipa
          else
            echo "ERROR: Widget.app not found"
            find "$DD" -name "Widget.app" 2>/dev/null | head -5
            exit 1
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
