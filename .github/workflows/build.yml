name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build and Package IPA
        run: |
          set -e
          
          # Generate Xcode project first
          xcodegen generate
          
          # Build using xcodebuild
          xcodebuild -project Widget.xcodeproj -scheme Widget -configuration Release \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            OTHER_CODE_SIGN_FLAGS="--" \
            build 2>&1 | tee build.log | tail -50
          
          # Show any errors
          echo "=== Build Errors ==="
          grep -i "error:" build.log || echo "No errors found"
          
          # Find Widget.app anywhere in build
          APP=$(find ./build -name "Widget.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            echo "Found: $APP"
            mkdir -p Payload
            cp -R "$APP" Payload/
            chmod +x Payload/Widget.app/Widget
          else
            echo "Widget.app not found!"
            echo "=== Build Products ==="
            find ./build -name "*.app" -type d 2>/dev/null || echo "No .app files found"
            exit 1
          fi
          zip -r Widget.ipa Payload
          ls -la *.ipa 
    
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Widget
          path: Widget.ipa
          retention-days: 30
